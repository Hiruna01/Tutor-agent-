# Railway config-as-code for the TutorAgent ADK backend.
# Only picked up once the service's "Root Directory" (dashboard setting) is
# set to this folder (bwai-adk-basic-demo) — Railway looks for this file
# inside whatever root directory you configure.
[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# $PORT is injected by Railway. $ALLOW_ORIGINS is a variable you set in the
# dashboard so CORS can change without editing this file. The trailing "."
# tells ADK to scan this directory for agents (finds tutor_agent/).
startCommand = "adk api_server --host 0.0.0.0 --port $PORT --allow_origins \"$ALLOW_ORIGINS\" ."
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
