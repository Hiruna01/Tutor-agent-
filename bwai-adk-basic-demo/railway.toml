# Railway config-as-code for the TutorAgent ADK backend.
# Only picked up once the service's "Root Directory" (dashboard setting) is
# set to this folder (bwai-adk-basic-demo) — Railway looks for this file
# inside whatever root directory you configure.
[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# $PORT is injected by Railway. The Vercel origin is hardcoded here (instead of
# read from a dashboard variable) so CORS can't silently break if the variable
# is unset or not shell-expanded. Change it if your Vercel domain changes.
# The trailing "." tells ADK to scan this directory for agents (finds tutor_agent/).
startCommand = "adk api_server --host 0.0.0.0 --port $PORT --allow_origins https://tutor-agent-u67l.vercel.app ."
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
